[project]
name = "monkeyocr-gateway"
version = "0.1.0"
description = "PaddleOCR-VL /layout-parsing gateway in front of a vLLM server running MonkeyOCRv2-B-Parsing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "httpx",
    "numpy>=2,<3",
    "pillow",
    "pymupdf>=1.26,<2",
    "pypdfium2",
    "uvicorn",
]

[project.optional-dependencies]
vllm-cu126 = ["vllm==0.11.2", "torch", "torchvision", "torchaudio"]
vllm-cu128 = ["vllm==0.11.2", "torch", "torchvision", "torchaudio"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
conflicts = [[{ extra = "vllm-cu126" }, { extra = "vllm-cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "vllm-cu126" },
    { index = "pytorch-cu128", extra = "vllm-cu128" },
]
torchvision = [
    { index = "pytorch-cu126", extra = "vllm-cu126" },
    { index = "pytorch-cu128", extra = "vllm-cu128" },
]
torchaudio = [
    { index = "pytorch-cu126", extra = "vllm-cu126" },
    { index = "pytorch-cu128", extra = "vllm-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
